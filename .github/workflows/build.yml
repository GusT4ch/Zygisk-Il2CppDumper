name: Build
on:
  push:
    branches: [ offset-resolver ]
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game (leave empty if already hardcoded):"
          required: false
          default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    - run: |
        chmod +x ./gradlew
        PKG="${{ github.event.inputs.package_name }}"
        if [ -n "$PKG" ]; then
          sed -i "s/moduleDescription = \"/moduleDescription = \"($PKG) /g" module.gradle
          sed -i "s/com.game.packagename/$PKG/g" module/src/main/cpp/game.h
        fi
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-offset-resolver
        path: out/magisk_module_release/

  build_tools:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup NDK
      id: ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d
        local-cache: true
    - name: Build read_pos (Android x86_64)
      run: |
        TOOLCHAIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
        echo "=== NDK path ==="
        echo "${{ steps.ndk.outputs.ndk-path }}"
        echo "=== Toolchain contents ==="
        ls -la "$TOOLCHAIN/bin/" | grep -i "x86_64-linux-android" | head -20
        echo "=== Find clang ==="
        find "$TOOLCHAIN/bin/" -name "x86_64*clang" | head -5
        # Pick any available x86_64 android clang
        CC=$(find "$TOOLCHAIN/bin/" -name "x86_64-linux-android*-clang" | head -1)
        echo "Using CC=$CC"
        mkdir -p out/tools
        "$CC" -O2 -static -o out/tools/read_pos tools/read_pos/read_pos.c
        file out/tools/read_pos
        ls -la out/tools/
    - uses: actions/upload-artifact@v4
      with:
        name: phantom-tools
        path: out/tools/
