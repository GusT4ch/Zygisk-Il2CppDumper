name: Build
on:
  push:
    branches: [ offset-resolver ]
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game (leave empty if already hardcoded):"
          required: false
          default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    - run: |
        chmod +x ./gradlew
        PKG="${{ github.event.inputs.package_name }}"
        if [ -n "$PKG" ]; then
          sed -i "s/moduleDescription = \"/moduleDescription = \"($PKG) /g" module.gradle
          sed -i "s/com.game.packagename/$PKG/g" module/src/main/cpp/game.h
        fi
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-offset-resolver
        path: out/magisk_module_release/
