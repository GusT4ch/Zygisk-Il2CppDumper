name: Build
on:
  push:
    branches: [ offset-resolver ]
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game (leave empty if already hardcoded):"
          required: false
          default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    - run: |
        chmod +x ./gradlew
        PKG="${{ github.event.inputs.package_name }}"
        if [ -n "$PKG" ]; then
          sed -i "s/moduleDescription = \"/moduleDescription = \"($PKG) /g" module.gradle
          sed -i "s/com.game.packagename/$PKG/g" module/src/main/cpp/game.h
        fi
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-offset-resolver
        path: out/magisk_module_release/

  build_tools:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Download NDK directly
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O ndk.zip
        unzip -q ndk.zip
        echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV
    - name: Build read_pos (Android x86_64)
      run: |
        TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
        ls "$TOOLCHAIN/bin/clang"
        mkdir -p out/tools
        "$TOOLCHAIN/bin/clang" --target=x86_64-linux-android26 \
          -O2 -static -o out/tools/read_pos tools/read_pos/read_pos.c
        file out/tools/read_pos
        ls -la out/tools/
    - uses: actions/upload-artifact@v4
      with:
        name: phantom-tools
        path: out/tools/
